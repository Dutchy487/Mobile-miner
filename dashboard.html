<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#07090f" />
  <title>MobileMiner — Live Feed</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#07090f;--bg2:#0c1220;--bg3:#111b2d;
      --border:#1b3354;--border2:#25456e;
      --accent:#00cfff;--green:#00ff9d;--warn:#ffaa00;--danger:#ff4455;
      --text:#c0daf0;--dim:#3d6080;
      --mono:'Courier New',monospace;
      --display:-apple-system,Roboto,Helvetica,Arial,sans-serif;
    }
    body{background:var(--bg);color:var(--text);font-family:var(--display);}
    .app{max-width:480px;margin:0 auto;padding-bottom:60px;}
    .hdr{background:linear-gradient(180deg,#040609,var(--bg));border-bottom:1px solid var(--border);padding:16px 18px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
    .logo{font-family:var(--mono);font-size:13px;letter-spacing:3px;color:var(--accent);text-transform:uppercase;font-weight:700;}
    .logo em{color:var(--green);font-style:normal;}
    .live-dot{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;color:var(--dim);}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;}
    .dot.on{background:var(--green);box-shadow:0 0 8px var(--green);animation:blink 1.4s infinite;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

    .sec{margin:14px 14px 0;background:var(--bg2);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
    .sec-hdr{background:var(--bg3);border-bottom:1px solid var(--border);padding:9px 14px;font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;font-family:var(--mono);font-weight:700;}
    .sec-body{padding:14px;}

    .addr-box{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:11px 13px;font-family:var(--mono);font-size:11px;word-break:break-all;color:var(--text);line-height:1.6;}
    .row-btns{display:flex;gap:8px;margin-top:10px;}
    .mini-btn{flex:1;padding:10px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-align:center;text-decoration:none;cursor:pointer;}
    .mini-btn.copied{color:var(--green);border-color:var(--green);}

    .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
    .stat-box{background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:12px 12px;}
    .stat-lbl{font-size:9px;letter-spacing:1.5px;color:var(--dim);font-family:var(--mono);margin-bottom:4px;text-transform:uppercase;}
    .stat-val{font-size:22px;font-weight:800;font-family:var(--mono);}
    .c-blue{color:var(--accent)} .c-green{color:var(--green)} .c-warn{color:var(--warn)} .c-text{color:var(--text)}

    .pending-big{text-align:center;padding:6px 0 4px;}
    .pending-num{font-size:30px;font-weight:800;font-family:var(--mono);color:var(--green);}
    .pending-sub{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:2px;}

    .feed-box{background:var(--bg);border:1px solid var(--border);border-radius:4px;height:160px;overflow-y:auto;padding:10px 12px;font-family:var(--mono);font-size:11px;}
    .feed-entry{display:flex;gap:8px;margin-bottom:5px;}
    .feed-time{color:var(--dim);flex-shrink:0;}
    .fe-ok{color:var(--green);} .fe-err{color:var(--danger);} .fe-info{color:var(--text);}

    .refresh-lbl{font-size:10px;color:var(--dim);font-family:var(--mono);text-align:center;margin-top:10px;}
    .empty-state{font-size:12px;color:var(--dim);font-family:var(--mono);text-align:center;padding:20px 10px;line-height:1.7;}
    .empty-state a{color:var(--accent);}

    .footer-links{padding:16px 14px 0;display:flex;flex-direction:column;gap:8px;}
    .foot-link{display:block;padding:12px;border-radius:4px;text-align:center;font-size:14px;font-weight:700;letter-spacing:.5px;text-decoration:none;border:1px solid var(--border);color:var(--dim);}
    .foot-link.primary{background:linear-gradient(135deg,#00a865,#00ff9d);color:#040609;border:none;}
  </style>
</head>
<body>
  <div class="app">
    <div class="hdr">
      <div class="logo">MOBILE<em>MINER</em> · LIVE</div>
      <div class="live-dot">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">WAITING</span>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hdr">Your Wallet</div>
      <div class="sec-body">
        <div class="addr-box" id="addrBox"></div>
        <div class="row-btns">
          <div class="mini-btn" id="copyBtn">Copy Address</div>
          <a class="mini-btn" id="walletLink" href="#">Open Wallet</a>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hdr">Live Pool Stats</div>
      <div class="sec-body" id="statsArea">
        <div class="empty-state">Loading…</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-hdr">Live Feed</div>
      <div class="sec-body" style="padding:10px 14px">
        <div class="feed-box" id="feedBox"></div>
        <div class="refresh-lbl" id="refreshLbl">Refreshes every 30 seconds</div>
      </div>
    </div>

    <div class="footer-links">
      <a class="foot-link" id="poolPageLink" href="#" target="_blank" rel="noreferrer">View Full Pool Page</a>
      <a class="foot-link" id="walletLink2" href="#">Open In Monero Wallet</a>
      <a class="foot-link primary" href="https://www.kucoin.com/assets/deposit" target="_blank" rel="noreferrer">Open KuCoin →</a>
    </div>
  </div>

  <script>
    var WALLET = "86zbf1gyvCiK12jxXuuVNYTH5R97JDSk6dvT3jwa5uxXbCkjzCWjfViY3YDQ8DWQpeXdL6rw8XnpEKyVc6zi67n7VXnhEYZ";
    var API_URL = "https://api.moneroocean.stream/miner/" + WALLET + "/stats";
    var POOL_PAGE = "https://moneroocean.stream/?addr=" + WALLET;
    var WALLET_URI = "monero:" + WALLET;

    document.getElementById("addrBox").textContent = WALLET;
    document.getElementById("walletLink").href = WALLET_URI;
    document.getElementById("walletLink2").href = WALLET_URI;
    document.getElementById("poolPageLink").href = POOL_PAGE;

    var feedBox = document.getElementById("feedBox");
    var feedItems = [];

    function addFeed(msg, type) {
      var time = new Date().toLocaleTimeString();
      feedItems.push({ msg: msg, type: type || "info", time: time });
      if (feedItems.length > 30) feedItems.shift();
      renderFeed();
    }

    function renderFeed() {
      feedBox.innerHTML = feedItems.map(function (e) {
        var cls = e.type === "ok" ? "fe-ok" : e.type === "err" ? "fe-err" : "fe-info";
        return '<div class="feed-entry"><span class="feed-time">' + e.time + '</span><span class="' + cls + '">' + e.msg + '</span></div>';
      }).join("");
      feedBox.scrollTop = feedBox.scrollHeight;
    }

    function fmtXMR(piconero) {
      if (piconero === undefined || piconero === null) return "—";
      return (piconero / 1e12).toFixed(6);
    }

    function renderStats(data) {
      var html = '';
      html += '<div class="stats-grid">';
      html += '<div class="stat-box"><div class="stat-lbl">Hashrate</div><div class="stat-val c-blue">' + (data.hash || 0) + ' H/s</div></div>';
      html += '<div class="stat-box"><div class="stat-lbl">Valid Shares</div><div class="stat-val c-green">' + (data.validShares || 0) + '</div></div>';
      html += '<div class="stat-box"><div class="stat-lbl">Invalid Shares</div><div class="stat-val c-warn">' + (data.invalidShares || 0) + '</div></div>';
      html += '<div class="stat-box"><div class="stat-lbl">Total Hashes</div><div class="stat-val c-text">' + (data.totalHashes ? Number(data.totalHashes).toLocaleString() : 0) + '</div></div>';
      html += '</div>';
      html += '<div class="pending-big"><div class="pending-num">' + fmtXMR(data.amtDue) + '</div><div class="pending-sub">XMR pending payout</div></div>';
      html += '<div class="pending-sub" style="text-align:center">' + fmtXMR(data.amtPaid) + ' XMR paid out so far · ' + (data.txnCount || 0) + ' payments</div>';
      document.getElementById("statsArea").innerHTML = html;
    }

    function renderEmpty() {
      document.getElementById("statsArea").innerHTML =
        '<div class="empty-state">No data yet. This means the pool hasn\'t recorded a share from your miner, or the request was blocked.<br><br><a href="' + POOL_PAGE + '" target="_blank">Check directly on MoneroOcean →</a></div>';
    }

    function setStatus(connected) {
      var dot = document.getElementById("statusDot");
      var txt = document.getElementById("statusText");
      if (connected) {
        dot.classList.add("on");
        txt.textContent = "CONNECTED";
      } else {
        dot.classList.remove("on");
        txt.textContent = "WAITING";
      }
    }

    function poll() {
      addFeed("Polling pool API…", "info");
      fetch(API_URL)
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          return res.json();
        })
        .then(function (data) {
          renderStats(data);
          setStatus(true);
          document.getElementById("refreshLbl").textContent =
            "Last updated " + new Date().toLocaleTimeString() + " · refreshes every 30s";
          addFeed("Stats received — " + (data.hash || 0) + " H/s, " + (data.validShares || 0) + " valid shares", "ok");
        })
        .catch(function (err) {
          setStatus(false);
          renderEmpty();
          addFeed("Poll failed: " + err.message + " — view directly on pool site", "err");
        });
    }

    document.getElementById("copyBtn").addEventListener("click", function () {
      var btn = this;
      navigator.clipboard.writeText(WALLET).then(function () {
        btn.textContent = "✓ Copied";
        btn.classList.add("copied");
        setTimeout(function () {
          btn.textContent = "Copy Address";
          btn.classList.remove("copied");
        }, 2000);
      });
    });

    poll();
    setInterval(poll, 30000);
  </script>
</body>
</html>
